name: jj

services:

  # ----------------------------------------------------------------------------------------------------------------------------------------

  kafka1:
    image: apache/kafka:3.8.0
    container_name: kafka1
    hostname: kafka1
    restart: unless-stopped
    ports:
      - "2160:2161"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:2161,EXTERNAL://kafka.rgzz:2160
      KAFKA_LISTENERS: INTERNAL://:2161,CONTROLLER://:2162,EXTERNAL://:2160
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:2162
      KAFKA_CLUSTER_ID: wmpq8imuMSadFpbyBzYIPg==   # любой случайный base64 длиной 22 символа
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka1_data:/opt/kafka/data
    ulimits:
      nofile: 262144
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:2161" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - docker-network

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:2161 --create --if-not-exists --topic frigate-events --partitions 6 --replication-factor 1
        echo "Topics created successfully."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:2161 --list
    networks:
      - docker-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8385:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:2161
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    environment:
      - ZOO_CFG_EXTRA="server.1=0.0.0.0:2888:3888"
      - ZOO_MY_ID=1
      - SERVER_JVMFLAGS=-Dzookeeper.serverCnxnSocket=org.apache.zookeeper.server.NettyServerCnxnFactory
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/log/zookeeper
    networks:
      - docker-network
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-01:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-starlight-01
    hostname: clickhouse-starlight-01
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9363:9363"
      - "9000:9000"
    volumes:
      - ${CLICKHOUSE_CONFIG_DIR_01}/config.xml:/etc/clickhouse-server/config.xml
      - ${CLICKHOUSE_CONFIG_DIR_01}/users.xml:/etc/clickhouse-server/users.xml
      - ${CLICKHOUSE_CONFIG_DIR_01}/users.d:/etc/clickhouse-server/users.d
      - ${CLICKHOUSE_CONFIG_DIR_01}/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data_01:/var/lib/clickhouse
    env_file:
      - .env
    networks:
      - docker-network

  clickhouse-02:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-starlight-02
    hostname: clickhouse-starlight-02
    restart: unless-stopped
    ports:
      - "8124:8123"
      - "9364:9363"
      - "9001:9000"
    volumes:
      - ${CLICKHOUSE_CONFIG_DIR_02}/config.xml:/etc/clickhouse-server/config.xml
      - ${CLICKHOUSE_CONFIG_DIR_02}/users.xml:/etc/clickhouse-server/users.xml
      - ${CLICKHOUSE_CONFIG_DIR_02}/users.d:/etc/clickhouse-server/users.d
      - ${CLICKHOUSE_CONFIG_DIR_02}/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data_02:/var/lib/clickhouse
    env_file:
      - .env
    networks:
      - docker-network

  clickhouse-03:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-brightsky-01
    hostname: clickhouse-brightsky-01
    restart: unless-stopped
    ports:
      - "8125:8123"
      - "9365:9363"
      - "9002:9000"
    volumes:
      - ./docker/clickhouse/brightsky01/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/brightsky01/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/brightsky01/users.d:/etc/clickhouse-server/users.d
      - ./docker/clickhouse/brightsky01/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data_03:/var/lib/clickhouse
    networks:
      - docker-network

  clickhouse-04:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-brightsky-02
    hostname: clickhouse-brightsky-02
    restart: unless-stopped
    ports:
      - "8126:8123"
      - "9366:9363"
      - "9003:9000"
    volumes:
      - ./docker/clickhouse/brightsky02/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/brightsky02/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/brightsky02/users.d:/etc/clickhouse-server/users.d
      - ./docker/clickhouse/brightsky02/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data_04:/var/lib/clickhouse
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ \"$REDIS_ROLE\" = 'replica' ]; then
        redis-server --replicaof redis-master.rgzz 6379 --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru;
      fi
      "
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docker-network

  sentinel-1:
    image: redis:latest
    container_name: sentinel-1
    restart: unless-stopped
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/etc/sentinel.conf
      - sentinel-1-tmp:/tmp
    networks:
      - docker-network

  sentinel-2:
    image: redis:latest
    container_name: sentinel-2
    restart: unless-stopped
    command: redis-sentinel /etc/sentinel.conf
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/etc/sentinel.conf
      - sentinel-2-tmp:/tmp
    networks:
      - docker-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    environment:
      - REDISINSIGHT_LOGFILE=/data/redisinsight.log
    networks:
      - docker-network
    depends_on:
      - redis
  # ----------------------------------------------------------------------------------------------------------------------------------------
  langflow:
    depends_on:
      - postgres
    image: langflowai/langflow:latest
    container_name: langflow
    hostname: langflow.rgzz
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_CONFIG_DIR=/app/config
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres.rgzz:5432/langflow
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  flowise:
    depends_on:
      - postgres
    image: flowiseai/flowise:latest
    container_name: flowise
    hostname: flowise.rgzz
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - FLOWISE_CONFIG_DIR=/app/config
      #- FLOWISE_DATABASE_URL=postgresql://flowise:flowise@postgres.rgzz:5432/flowise
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=admin
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=postgres.rgzz
      - DATABASE_PORT=5432
      - DATABASE_NAME=flowise
      - DATABASE_USER=flowise
      - DATABASE_PASSWORD=flowise
    volumes:
      - flowise_data:/root/.flowise
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  postgres:
    #image: postgres:latest
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres.rgzz
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------


  # ----------------------------------------------------------------------------------------------------------------------------------------
networks:
  docker-network:
    external: true

volumes:
  zookeeper_data:
  zookeeper_logs:
  clickhouse_data_01:
  clickhouse_data_02:
  clickhouse_data_03:
  clickhouse_data_04:
  kafka1_data:
  redis-data:
  sentinel-1-tmp:
  sentinel-2-tmp:
  redis-insight-data:
  postgres_data:
  flowise_data:
