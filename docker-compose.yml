name: jj

services:

  # ----------------------------------------------------------------------------------------------------------------------------------------

  kafka1:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka.rgzz
    restart: unless-stopped
    ports:
      - "2160:2160"
      - "2161:2161"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka.rgzz:2161,EXTERNAL://kafka.rgzz:2160
      KAFKA_LISTENERS: INTERNAL://:2161,CONTROLLER://:2162,EXTERNAL://:2160
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka.rgzz:2162
      KAFKA_CLUSTER_ID: wmpq8imuMSadFpbyBzYIPg==
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka1_data:/opt/kafka/data
    ulimits:
      nofile: 262144
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:2161" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - docker-network

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.rgzz:2161 --create --if-not-exists --topic frigate-events --partitions 6 --replication-factor 1
        echo "Topics created successfully."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.rgzz:2161 --list
    networks:
      - docker-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8385:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka.rgzz:2161
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse.home
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    volumes:
      - ./docker/clickhouse/standalone/config.xml:/etc/clickhouse-server/config.d/custom.xml
      - ./docker/clickhouse/standalone/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/standalone/users.d:/etc/clickhouse-server/users.d
      - ./docker/clickhouse/standalone/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ${CLICKHOUSE_STANDALONE_DATA_PATH}:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector/config.yaml" ]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector/config.yaml
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  redis:
    image: redis:latest
    container_name: redis
    hostname: redis.home
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docker-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    environment:
      - REDISINSIGHT_LOGFILE=/data/redisinsight.log
    networks:
      - docker-network
    depends_on:
      - redis
  # ----------------------------------------------------------------------------------------------------------------------------------------
  langflow:
    depends_on:
      - postgres
    image: langflowai/langflow:1.9.3
    container_name: langflow
    hostname: langflow.rgzz
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_HOST=0.0.0.0
      - LANGFLOW_PORT=7860
      - LANGFLOW_DATABASE_URL=postgresql+psycopg://${LANGFLOW_DB_USER}:${LANGFLOW_DB_PASSWORD}@postgres.rgzz:5432/langflow
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY}
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD}
      - LANGFLOW_LANGUAGE=en
      - LANGFLOW_FRONTEND_LANGUAGE=en
    volumes:
      - langflow_data:/app/.langflow
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  flowise:
    depends_on:
      - postgres
    image: flowiseai/flowise:latest
    container_name: flowise
    hostname: flowise.rgzz
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - FLOWISE_CONFIG_DIR=/root/.flowise/app/config
      #- FLOWISE_DATABASE_URL=postgresql://${FLOWISE_DB_USER}:${FLOWISE_DB_PASSWORD}@postgres.rgzz:5432/flowise
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=postgres.rgzz
      - DATABASE_PORT=5432
      - DATABASE_NAME=flowise
      - DATABASE_USER=${FLOWISE_DB_USER}
      - DATABASE_PASSWORD=${FLOWISE_DB_PASSWORD}
      - FLOWISE_USERNAME=${FLOWISE_USERNAME}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      - DEBUG=true
      - LOG_LEVEL=debug
#      - HTTP_PROXY=http://${PROXY_USER}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}
#      - HTTPS_PROXY=http://${PROXY_USER}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}
#      - NO_PROXY=localhost,127.0.0.1,postgres.rgzz,host.docker.internal,172.0.0.0/8,10.0.0.0/8,192.168.0.0/16
    volumes:
      - flowise_data:/root/.flowise
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  postgres:
    #image: postgres:latest
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres.rgzz
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------


  # ----------------------------------------------------------------------------------------------------------------------------------------
networks:
  docker-network:
    external: true

volumes:
  kafka1_data:
  redis-data:
  redis-insight-data:
  postgres_data:
  flowise_data:
  langflow_data:
  clickhouse_data:
