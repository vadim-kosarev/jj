name: jj

services:

  # ----------------------------------------------------------------------------------------------------------------------------------------

  kafka1:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka.rgzz
    restart: unless-stopped
    ports:
      - "2160:2160"
      - "2161:2161"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka.rgzz:2161,EXTERNAL://kafka.rgzz:2160
      KAFKA_LISTENERS: INTERNAL://:2161,CONTROLLER://:2162,EXTERNAL://:2160
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka.rgzz:2162
      KAFKA_CLUSTER_ID: wmpq8imuMSadFpbyBzYIPg==
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka1_data:/opt/kafka/data
    ulimits:
      nofile: 262144
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:2161" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - docker-network

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.rgzz:2161 --create --if-not-exists --topic frigate-events --partitions 6 --replication-factor 1
        echo "Topics created successfully."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.rgzz:2161 --list
    networks:
      - docker-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8385:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka.rgzz:2161
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse.home
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    volumes:
      - ./docker/clickhouse/standalone/config.xml:/etc/clickhouse-server/config.d/custom.xml
      - ./docker/clickhouse/standalone/users.xml:/etc/clickhouse-server/users.xml
      - ./docker/clickhouse/standalone/users.d:/etc/clickhouse-server/users.d
      - ./docker/clickhouse/standalone/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ${CLICKHOUSE_STANDALONE_DATA_PATH}:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------

  redis:
    image: redis:latest
    container_name: redis
    hostname: redis.home
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docker-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    environment:
      - REDISINSIGHT_LOGFILE=/data/redisinsight.log
    networks:
      - docker-network
    depends_on:
      - redis
  # ----------------------------------------------------------------------------------------------------------------------------------------
  langflow:
    depends_on:
      - postgres
    image: langflowai/langflow:latest
    container_name: langflow
    hostname: langflow.rgzz
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_CONFIG_DIR=/app/config
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres.rgzz:5432/langflow
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  flowise:
    depends_on:
      - postgres
    image: flowiseai/flowise:latest
    container_name: flowise
    hostname: flowise.rgzz
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - FLOWISE_CONFIG_DIR=/root/.flowise/app/config
      #- FLOWISE_DATABASE_URL=postgresql://flowise:flowise@postgres.rgzz:5432/flowise
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=admin
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=postgres.rgzz
      - DATABASE_PORT=5432
      - DATABASE_NAME=flowise
      - DATABASE_USER=flowise
      - DATABASE_PASSWORD=flowise
    volumes:
      - flowise_data:/root/.flowise
    networks:
      - docker-network
  # ----------------------------------------------------------------------------------------------------------------------------------------
  postgres:
    #image: postgres:latest
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres.rgzz
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - docker-network

  # ----------------------------------------------------------------------------------------------------------------------------------------


  # ----------------------------------------------------------------------------------------------------------------------------------------
networks:
  docker-network:
    external: true

volumes:
  kafka1_data:
  redis-data:
  redis-insight-data:
  postgres_data:
  flowise_data:
  clickhouse_data:
